[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prc2026-vigorous-whistle"
version = "0.1.0"
description = "Reproducible taxi-out experiments for PRC Data Challenge 2026"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=21,<24",
  "psutil>=7,<8",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

